; PlatformIO Project Configuration File

[platformio]
default_envs = teensy41
src_dir  = src
lib_dir  = systems
test_dir = test

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++14
build_flags =
    -D USB_SERIAL
    -D GNC_HARDWARE_BUILD
    -std=gnu++17
    -I Autonomous-Controls-Fixed-Wing/include
lib_deps =
    sparkfun/SparkFun u-blox GNSS v3@^3.1.9
    sparkfun/SparkFun Qwiic 6Dof - LSM6DSO@^1.0.2
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    xreef/EByte LoRa E32 library@^1.5.13
    https://github.com/bolderflight/eigen.git
    https://github.com/adafruit/Adafruit_ICM20X

[env:native]
platform = native
test_framework = unity
lib_ignore = Logging_Subsystem
build_flags =
    -std=c++17
    -I Autonomous-Controls-Fixed-Wing/include
lib_deps =
    https://github.com/bolderflight/eigen.git