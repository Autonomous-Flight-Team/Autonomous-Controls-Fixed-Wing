; PlatformIO Project Configuration File
;
; Code layout: each system lives in systems/<name>/ with its .h next to its .cpp.
; src/ only holds main.cpp. build_src_filter pulls the systems into the build.
;
; Sensor selection (systems/sensors/sensor_suite.h):
;   teensy41        real drivers (GNC_HARDWARE_BUILD)
;   teensy41_dummy  same firmware with dummy sensors (GOOSE_DUMMY_SENSORS),
;                   for bench-testing logging with nothing attached
;   native          dummy sensors, unit tests on your computer

[common]
system_includes =
    -I systems/logging
    -I systems/sensors
    -I systems/state

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; Libraries come only from lib_deps (fetched into .pio/libdeps). Do not commit
; library clones into lib/ - they become empty submodule pointers for everyone else.
build_src_filter =
    +<*>
    +<../systems/>
build_flags =
    -D USB_SERIAL
    -include Arduino.h
    -D GNC_HARDWARE_BUILD
    -std=gnu++17
    -I include
    -I $PROJECT_LIBDEPS_DIR/$PIOENV/bmp390/interface
    ${common.system_includes}
monitor_speed = 115200
lib_deps =
    https://github.com/libdriver/bmp390
    https://github.com/bolderflight/ublox.git
    https://github.com/bolderflight/ms4525do.git
    sparkfun/SparkFun LSM9DS1 IMU

[env:teensy41_dummy]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -D GOOSE_DUMMY_SENSORS

; PC build for unit tests. All of systems/ is built: hardware-only files are
; wrapped in #ifdef GNC_HARDWARE_BUILD and compile to nothing here.
; test/stubs/ stands in for Arduino.h and SdFat.h (used by the logging core).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<../systems/>
    +<../test/stubs/>
build_flags =
    -std=c++17
    -I include
    -I test/stubs
    ${common.system_includes}
