; PlatformIO Project Configuration File

[platformio]
lib_dir = lib

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = 
	-D USB_SERIAL
	-include Arduino.h
	-D GNC_HARDWARE_BUILD
	-std=gnu++17
	-I include
	-I lib/bmp390
	-I lib/bmp390/driver
	-I lib/bmp390/interface
	-I lib/bmp390/example
	-I lib/ublox
	-I lib/ublox/src
monitor_speed = 115200
lib_deps = 
	https://github.com/libdriver/bmp390
	https://github.com/bolderflight/ublox.git

[env:native]
platform = native
test_framework = unity
build_flags = 
	-std=c++17
	-I include
lib_deps = 
	https://github.com/libdriver/bmp390
	https://github.com/bolderflight/ublox.git