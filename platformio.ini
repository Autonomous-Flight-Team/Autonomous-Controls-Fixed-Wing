; PlatformIO Project Configuration File
;
; Code layout: each system lives in systems/<name>/ with its .h next to its .cpp.
; src/ only holds main.cpp. build_src_filter pulls the systems into the build.

[platformio]
lib_dir = lib

[common]
system_includes =
    -I systems/logging
    -I systems/sensors
    -I systems/state

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; systems/sensors is not built yet: it has never compiled (see systems/README.MD).
; Drop the -<../systems/sensors/> line once it does.
build_src_filter =
    +<*>
    +<../systems/>
    -<../systems/sensors/>
build_flags =
    -D USB_SERIAL
    -include Arduino.h
    -D GNC_HARDWARE_BUILD
    -std=gnu++17
    -I include
    -I $PROJECT_LIBDEPS_DIR/$PIOENV/bmp390/driver
    -I $PROJECT_LIBDEPS_DIR/$PIOENV/bmp390/interface
    -I $PROJECT_LIBDEPS_DIR/$PIOENV/bmp390/example
    ${common.system_includes}
monitor_speed = 115200
lib_deps =
    https://github.com/libdriver/bmp390
    https://github.com/bolderflight/ublox.git
    https://github.com/bolderflight/ms4525do.git
    sparkfun/SparkFun LSM9DS1 IMU

; PC build for unit tests. Only hardware-free systems (logging, state) are built here;
; test/stubs stands in for Arduino.h and SdFat.h.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<../systems/logging/>
    +<../systems/state/>
    +<../test/stubs/>
build_flags =
    -std=c++17
    -I include
    -I test/stubs
    ${common.system_includes}